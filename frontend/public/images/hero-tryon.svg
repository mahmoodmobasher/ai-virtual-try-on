<svg width="640" height="720" viewBox="0 0 640 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="720" rx="42" fill="url(#paint0_linear)"/>
  <g filter="url(#filter0_f)">
    <ellipse cx="320" cy="240" rx="220" ry="180" fill="url(#paint1_radial)"/>
  </g>
  <g filter="url(#filter1_f)">
    <ellipse cx="420" cy="420" rx="180" ry="160" fill="url(#paint2_radial)"/>
  </g>
  <text x="120" y="160" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="600">Virtual Try-On</text>
  <text x="120" y="210" fill="#D9DBFF" font-family="'Inter', sans-serif" font-size="18" opacity="0.8">Powered by diffusion & ControlNet</text>
  <rect x="120" y="260" width="400" height="320" rx="36" fill="#100F2A" opacity="0.9" stroke="#3835ff33" stroke-width="2"/>
  <rect x="160" y="300" width="320" height="240" rx="28" fill="#1B1940" stroke="#918DFF55" stroke-width="2"/>
  <circle cx="200" cy="340" r="24" fill="#544BFF" opacity="0.7"/>
  <rect x="240" y="328" width="160" height="24" rx="12" fill="#FFFFFF" opacity="0.85"/>
  <rect x="240" y="364" width="120" height="18" rx="9" fill="#FFFFFF" opacity="0.45"/>
  <rect x="180" y="420" width="240" height="20" rx="10" fill="#FFFFFF" opacity="0.2"/>
  <rect x="180" y="456" width="240" height="20" rx="10" fill="#FFFFFF" opacity="0.25"/>
  <rect x="180" y="492" width="180" height="20" rx="10" fill="#FFFFFF" opacity="0.3"/>
  <rect x="180" y="528" width="140" height="20" rx="10" fill="#FFFFFF" opacity="0.35"/>
  <defs>
    <filter id="filter0_f" x="0" y="0" width="640" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="40" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="filter1_f" x="120" y="220" width="600" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="50" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint0_linear" x1="128" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17162E"/>
      <stop offset="1" stop-color="#05040D"/>
    </linearGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 240) rotate(90) scale(180 220)">
      <stop stop-color="#5A50FF"/>
      <stop offset="1" stop-color="#5A50FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paint2_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 420) rotate(90) scale(160 180)">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
